<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><title>Riwayat QRIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>*{font-family:Inter,sans-serif}body{background:#0f172a;color:#fff}</style>
</head>
<body class="p-8">
  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between mb-6">
      <h1 class="text-3xl font-bold">📱 Riwayat QRIS</h1>
      <a href="dashboard.html" class="px-4 py-2 bg-slate-700 rounded-lg">← Dashboard</a>
    </div>

    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-800 p-5 rounded-2xl">
        <p class="text-slate-400 text-sm">Total Transaksi</p>
        <p id="statTotal" class="text-2xl font-bold text-purple-400">0</p>
      </div>
      <div class="bg-slate-800 p-5 rounded-2xl">
        <p class="text-slate-400 text-sm">Total Nominal</p>
        <p id="statNominal" class="text-2xl font-bold text-green-400">Rp 0</p>
      </div>
      <div class="bg-slate-800 p-5 rounded-2xl">
        <p class="text-slate-400 text-sm">Hari Ini</p>
        <p id="statHariIni" class="text-2xl font-bold text-cyan-400">Rp 0</p>
      </div>
    </div>

    <div class="bg-slate-800 p-6 rounded-2xl">
      <table class="w-full text-left text-sm">
        <thead class="text-slate-400 border-b border-slate-700">
          <tr>
            <th class="py-3">No. TRX</th>
            <th>Waktu</th>
            <th>Kasir</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="tabelQris"></tbody>
      </table>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script>
    (async () => {
      const profil = await guard(['admin', 'manager']);
      if (!profil) return;
      await load();
    })();

    async function load() {
      const { data } = await db.from('transactions')
        .select('*, profiles(nama)')
        .eq('metode_bayar', 'qris')
        .order('created_at', { ascending: false });

      const list = data || [];
      const total = list.reduce((s, t) => s + t.total, 0);
      const today = new Date().toISOString().split('T')[0];
      const totalHariIni = list.filter(t => t.created_at.startsWith(today)).reduce((s, t) => s + t.total, 0);

      document.getElementById('statTotal').textContent = list.length;
      document.getElementById('statNominal').textContent = 'Rp ' + total.toLocaleString('id-ID');
      document.getElementById('statHariIni').textContent = 'Rp ' + totalHariIni.toLocaleString('id-ID');

      document.getElementById('tabelQris').innerHTML = list.map(t => `
        <tr class="border-b border-slate-800">
          <td class="py-3 font-mono text-xs">${t.nomor_trx}</td>
          <td>${new Date(t.created_at).toLocaleString('id-ID')}</td>
          <td>${t.profiles?.nama || '-'}</td>
          <td class="font-bold text-purple-400">Rp ${t.total.toLocaleString('id-ID')}</td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="text-center py-8 text-slate-500">Belum ada transaksi QRIS</td></tr>';
    }
  </script>
</body>
</html>

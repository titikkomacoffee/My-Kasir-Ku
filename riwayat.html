  <style>
    *{font-family:'Inter',sans-serif}body{background:#f0fdfa;color:#0f172a;padding-bottom:80px}
    body.dark-mode{background:#0f172a;color:white}
    .menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;color:#64748b;transition:all 0.2s;cursor:pointer;text-decoration:none;font-weight:600;font-size:14px}
    .menu-item:hover{background:#f0fdfa;color:#14b8a6}
    .menu-item.active{background:linear-gradient(135deg,#14b8a6 0%,#0d9488 100%);color:white;box-shadow:0 8px 20px rgba(20,184,166,0.3)}
    .stat-card{background:white;border-radius:24px;box-shadow:0 4px 20px rgba(20,184,166,0.08);border:1px solid rgba(20,184,166,0.08)}
    body.dark-mode .stat-card{background:#1e293b;border-color:#334155}
    .header-gradient{background:linear-gradient(135deg,#14b8a6 0%,#0d9488 100%);color:white;padding:20px;border-radius:24px;box-shadow:0 10px 30px rgba(20,184,166,0.3)}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;align-items:center;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50}
    .bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:12px;color:#94a3b8;font-size:10px;font-weight:600;text-decoration:none;min-width:60px}
    .bottom-nav-item.active{color:#14b8a6}
    .bottom-nav-item .icon{font-size:22px}
    .fab-center{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#14b8a6 0%,#0d9488 100%);display:flex;align-items:center;justify-content:center;color:white;font-size:28px;box-shadow:0 8px 20px rgba(20,184,166,0.4);margin-top:-24px;text-decoration:none}
    .sidebar-desktop{width:260px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:40}
    .main-content{margin-left:260px;padding:32px;min-height:100vh}
    .btn-hamburger{display:none;position:fixed;top:16px;left:16px;z-index:45;width:48px;height:48px;border-radius:14px;background:white;border:1px solid #e2e8f0;color:#14b8a6;font-size:22px;cursor:pointer;align-items:center;justify-content:center}
    .badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
    .badge-cash{background:#10b98133;color:#10b981}
    .badge-qris{background:#8b5cf633;color:#a78bfa}
    .badge-piutang{background:#f59e0b33;color:#f59e0b}
    .trx-card{background:white;border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;border:1px solid #e2e8f0;transition:all 0.2s}
    .trx-card:hover{border-color:#14b8a6;transform:translateY(-2px);box-shadow:0 10px 30px rgba(20,184,166,0.1)}
    body.dark-mode .trx-card{background:#1e293b;border-color:#334155}
    @media (max-width:1023px){
      .sidebar-desktop{transform:translateX(-100%)}
      .sidebar-desktop.sidebar-open{transform:translateX(0)}
      .main-content{margin-left:0;padding:80px 16px 20px 16px}
      .btn-hamburger{display:flex}
    }
    @media (min-width:1024px){.bottom-nav{display:none}body{padding-bottom:0}}
  </style>
</head>
<body class="light-mode">

<button class="btn-hamburger" onclick="toggleSidebar()">☰</button>
<div id="sidebarOverlay" class="hidden" onclick="closeSidebar()"></div>

<div class="flex min-h-screen">
  <aside id="mainSidebar" class="sidebar-desktop sidebar p-4 flex flex-col hidden lg:flex">
    <div class="flex items-center gap-3 px-4 py-4 mb-2">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center overflow-hidden" style="background:linear-gradient(135deg,#14b8a6 0%,#0d9488 100%)">
        <img src="assets/logo.png" class="w-full h-full object-contain p-2" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\'font-size:24px\'>🛒</div>'">
      </div>
      <div>
        <h1 class="font-extrabold text-base leading-tight">KASIR <span style="color:#14b8a6">PRO</span></h1>
        <p class="text-xs text-slate-400">Point of Sale</p>
      </div>
    </div>
    <div class="px-4 mb-4 pb-4 border-b border-slate-100">
      <p id="sidebarNama" class="font-semibold text-sm truncate">...</p>
      <p id="sidebarRole" class="text-xs font-bold">...</p>
    </div>
    <nav class="flex-1 space-y-1">
      <a href="dashboard.html" class="menu-item">📊 <span>Dashboard</span></a>
      <a href="kasir.html" class="menu-item">💰 <span>Kasir (POS)</span></a>
      <a href="riwayat.html" class="menu-item active">🧾 <span>Riwayat Trx</span></a>
      <a href="produk.html" id="menu-produk" class="menu-item">📦 <span>Produk & Stok</span></a>
      <a href="laporan.html" id="menu-laporan" class="menu-item">📈 <span>Laporan</span></a>
      <a href="piutang.html" class="menu-item">💳 <span>Piutang</span></a>
      <a href="shift.html" class="menu-item">⏰ <span>Shift Kasir</span></a>
      <a href="absensi.html" class="menu-item">📸 <span>Absensi</span></a>
      <a href="karyawan.html" id="menu-karyawan" class="menu-item">👥 <span>Karyawan</span></a>
      <a href="pengaturan.html" id="menu-pengaturan" class="menu-item">⚙️ <span>Pengaturan</span></a>
    </nav>
    <div class="pt-4 border-t border-slate-100 space-y-1">
      <button onclick="pilihTema()" class="menu-item w-full text-left">🎨 <span>Ganti Tema</span></button>
      <button onclick="toggleMode()" class="menu-item w-full text-left">🌓 <span>Mode</span></button>
      <button onclick="logout()" class="menu-item w-full text-left text-red-500">🚪 <span>Logout</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="header-gradient mb-6">
      <h1 class="text-2xl font-extrabold">🧾 Riwayat Transaksi</h1>
      <p class="text-white/80 text-xs mt-1">Semua transaksi penjualan</p>
    </div>

    <div class="stat-card p-4 mb-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="search" placeholder="🔍 Cari no. TRX / kasir..."
          class="flex-1 px-4 py-3 rounded-xl bg-slate-50 border-2 border-slate-200 focus:border-teal-500 focus:outline-none text-sm">
        <input type="date" id="filterTanggal"
          class="px-4 py-3 rounded-xl bg-slate-50 border-2 border-slate-200 focus:border-teal-500 focus:outline-none text-sm">
      </div>
    </div>

    <div id="listRiwayat"></div>
  </main>
</div>

<div id="modalDetail" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end lg:items-center justify-center z-50 p-0 lg:p-4">
  <div class="bg-white rounded-t-3xl lg:rounded-3xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
    <div id="detailTrx"></div>
    <button onclick="document.getElementById('modalDetail').classList.add('hidden')" class="w-full mt-4 py-3 rounded-2xl bg-slate-100 font-bold text-slate-600">Tutup</button>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="bottom-nav-item"><span class="icon">🏠</span><span>Beranda</span></a>
  <a href="produk.html" class="bottom-nav-item"><span class="icon">📦</span><span>Produk</span></a>
  <a href="kasir.html" class="fab-center">+</a>
  <a href="riwayat.html" class="bottom-nav-item active"><span class="icon">🧾</span><span>Riwayat</span></a>
  <a href="pengaturan.html" class="bottom-nav-item"><span class="icon">⚙️</span><span>Lainnya</span></a>
</nav>

<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script>
let semuaTrx = [];

(async () => {
  showGlobalLoading('Memuat riwayat...');
  const profil = await guard();
  if (!profil) { hideGlobalLoading(); return; }
  await loadRiwayat();
  hideGlobalLoading();
})();

async function loadRiwayat() {
  showLoading('#listRiwayat', 4);
  const { data, error } = await db.from('transactions')
    .select('id, nomor_trx, created_at, metode_bayar, total, subtotal, diskon, kembalian, kasir_id, profiles(nama)')
    .order('created_at', { ascending: false }).limit(100);
  if (error) { console.error(error); toast('Error: ' + error.message, 'error'); return; }
  semuaTrx = data || [];
  renderList();
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const tgl = document.getElementById('filterTanggal').value;
  const filter = semuaTrx.filter(t => {
    const cocokSearch = (t.nomor_trx || '').toLowerCase().includes(q) || (t.profiles?.nama || '').toLowerCase().includes(q);
    const cocokTanggal = !tgl || t.created_at.startsWith(tgl);
    return cocokSearch && cocokTanggal;
  });

  const container = document.getElementById('listRiwayat');
  if (filter.length === 0) {
    container.innerHTML = '<div class="stat-card p-8 text-center text-slate-400">Belum ada transaksi</div>';
    return;
  }

  container.innerHTML = filter.map(t => {
    const badgeClass = t.metode_bayar === 'cash' ? 'badge-cash' : t.metode_bayar === 'qris' ? 'badge-qris' : 'badge-piutang';
    return `
      <div class="trx-card" onclick="lihatDetail('${t.id}')">
        <div class="flex flex-col sm:flex-row sm:justify-between gap-2">
          <div class="flex-1 min-w-0">
            <p class="font-mono text-xs text-slate-400">${t.nomor_trx}</p>
            <p class="text-sm mt-1">${new Date(t.created_at).toLocaleString('id-ID')}</p>
            <p class="text-xs text-slate-400 mt-1">Kasir: ${t.profiles?.nama || '-'}</p>
          </div>
          <div class="text-left sm:text-right">
            <span class="badge ${badgeClass}">${t.metode_bayar.toUpperCase()}</span>
            <p class="text-xl font-bold mt-1" style="color:#14b8a6">Rp ${t.total.toLocaleString('id-ID')}</p>
          </div>
        </div>
      </div>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', renderList);
document.getElementById('filterTanggal').addEventListener('change', renderList);

async function lihatDetail(id) {
  const trx = semuaTrx.find(t => t.id === id);
  if (!trx) return;
  const { data: items } = await db.from('transaction_items').select('nama_produk, harga, qty, subtotal').eq('transaction_id', id);
  document.getElementById('detailTrx').innerHTML = `
    <h3 class="text-xl font-bold mb-3">🧾 Detail Transaksi</h3>
    <div class="space-y-2 text-sm mb-4">
      <div class="flex justify-between"><span class="text-slate-500">No. TRX</span><span class="font-mono text-xs">${trx.nomor_trx}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Tanggal</span><span>${new Date(trx.created_at).toLocaleString('id-ID')}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Kasir</span><span>${trx.profiles?.nama || '-'}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Metode</span><span class="font-bold uppercase">${trx.metode_bayar}</span></div>
    </div>
    <div class="border-t border-slate-200 pt-3 mb-3">
      <p class="text-slate-500 text-sm mb-2">Item:</p>
      ${(items||[]).map(i => `
        <div class="flex justify-between text-sm py-1">
          <span>${i.nama_produk} × ${i.qty}</span>
          <span>Rp ${i.subtotal.toLocaleString('id-ID')}</span>
        </div>
      `).join('') || '<p class="text-slate-400 text-sm">Tidak ada item</p>'}
    </div>
    <div class="border-t border-slate-200 pt-3 space-y-2 text-sm">
      <div class="flex justify-between"><span class="text-slate-500">Subtotal</span><span>Rp ${trx.subtotal.toLocaleString('id-ID')}</span></div>
      ${trx.diskon > 0 ? `<div class="flex justify-between"><span class="text-slate-500">Diskon</span><span>-Rp ${trx.diskon.toLocaleString('id-ID')}</span></div>` : ''}
      <div class="flex justify-between font-bold text-lg"><span>Total</span><span style="color:#14b8a6">Rp ${trx.total.toLocaleString('id-ID')}</span></div>
      ${trx.metode_bayar === 'cash' ? `<div class="flex justify-between"><span class="text-slate-500">Kembalian</span><span>Rp ${trx.kembalian.toLocaleString('id-ID')}</span></div>` : ''}
    </div>`;
  document.getElementById('modalDetail').classList.remove('hidden');
}
</script>
</body>

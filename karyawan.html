<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karyawan — KASIR PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Inter',sans-serif}body{background:#0f172a;color:white}
    .card{background:#1e293b;border:1px solid #334155;border-radius:20px}
    .btn-primary{background:linear-gradient(135deg,#e31e24 0%,#b8171c 100%);transition:all 0.3s ease}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(227,30,36,0.4)}
    .badge{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.5px}
    .role-admin{background:#ef444433;color:#ef4444}
    .role-manager{background:#f59e0b33;color:#f59e0b}
    .role-kasir{background:#e31e2433;color:#e31e24}
    .status-aktif{background:#10b98133;color:#10b981}
    .status-nonaktif{background:#64748b33;color:#94a3b8}
    .avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  </style>
</head>
<body class="p-8">
<div class="max-w-6xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-3xl font-extrabold">👥 Manajemen Karyawan</h1>
      <p class="text-slate-400 mt-1">Kelola tim, role, dan hak akses</p>
    </div>
    <a href="dashboard.html" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg">← Dashboard</a>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="card p-5"><p class="text-slate-400 text-sm">Total Karyawan</p><p id="statTotal" class="text-2xl font-bold mt-1">0</p></div>
    <div class="card p-5"><p class="text-slate-400 text-sm">Admin</p><p id="statAdmin" class="text-2xl font-bold text-red-400 mt-1">0</p></div>
    <div class="card p-5"><p class="text-slate-400 text-sm">Manager</p><p id="statManager" class="text-2xl font-bold text-orange-400 mt-1">0</p></div>
    <div class="card p-5"><p class="text-slate-400 text-sm">Kasir</p><p id="statKasir" class="text-2xl font-bold text-red-500 mt-1">0</p></div>
  </div>

  <div class="card p-5 mb-6 border-l-4 border-l-red-500">
    <p class="text-sm text-slate-300">💡 <b>Cara tambah karyawan:</b> Minta karyawan daftar via halaman Login → Daftar dengan emailnya.</p>
  </div>

  <div class="flex flex-wrap gap-3 mb-4 items-center">
    <input type="text" id="search" placeholder="🔍 Cari nama / email..." class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:border-red-500 focus:outline-none w-64">
    <select id="filterRole" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm">
      <option value="all">Semua Role</option>
      <option value="admin">Admin</option>
      <option value="manager">Manager</option>
      <option value="kasir">Kasir</option>
    </select>
    <select id="filterStatus" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm">
      <option value="all">Semua Status</option>
      <option value="aktif">Aktif</option>
      <option value="nonaktif">Nonaktif</option>
    </select>
    <button onclick="loadKaryawan()" class="ml-auto px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm font-semibold">🔄 Refresh</button>
  </div>

  <div id="listKaryawan" class="space-y-3"></div>
</div>

<div id="modalEdit" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="card p-6 w-full max-w-md">
    <h3 class="text-2xl font-bold mb-2">✏️ Edit Karyawan</h3>
    <p id="mEmail" class="text-slate-400 text-sm mb-4">-</p>
    <label class="text-sm text-slate-400">Nama Lengkap</label>
    <input type="text" id="mNama" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white mt-1 focus:border-red-500 focus:outline-none">
    <label class="text-sm text-slate-400 mt-3 block">Role</label>
    <select id="mRole" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white mt-1">
      <option value="kasir">Kasir</option>
      <option value="manager">Manager</option>
      <option value="admin">Admin</option>
    </select>
    <label class="text-sm text-slate-400 mt-3 block">Status Akun</label>
    <select id="mStatus" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white mt-1">
      <option value="true">Aktif</option>
      <option value="false">Nonaktif</option>
    </select>
    <div class="flex gap-2 mt-6">
      <button onclick="tutupModal('modalEdit')" class="flex-1 py-3 rounded-xl bg-slate-700 font-semibold">Batal</button>
      <button onclick="simpanEdit()" class="flex-1 py-3 rounded-xl btn-primary font-bold">Simpan</button>
    </div>
  </div>
</div>

<div id="modalDetail" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="card p-6 w-full max-w-md">
    <div id="detailContent"></div>
    <button onclick="tutupModal('modalDetail')" class="w-full mt-4 py-3 rounded-xl bg-slate-700 font-semibold">Tutup</button>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script>
let user;
let semuaKaryawan = [];
let karyawanEdit = null;

(async () => {
  const profil = await guard(['admin']);
  if (!profil) return;
  user = profil;
  await loadKaryawan();
})();

async function loadKaryawan() {
  const { data: profiles } = await db.from('profiles').select('*').order('created_at', { ascending: false });
  const { data: trxs } = await db.from('transactions').select('kasir_id, total').eq('status', 'selesai');

  semuaKaryawan = (profiles || []).map(p => {
    const trxKasir = (trxs || []).filter(t => t.kasir_id === p.id);
    return { ...p, totalTrx: trxKasir.length, totalOmzet: trxKasir.reduce((s, t) => s + t.total, 0) };
  });

  hitungStatistik();
  renderList();
}

function hitungStatistik() {
  document.getElementById('statTotal').textContent = semuaKaryawan.length;
  document.getElementById('statAdmin').textContent = semuaKaryawan.filter(k => k.role === 'admin').length;
  document.getElementById('statManager').textContent = semuaKaryawan.filter(k => k.role === 'manager').length;
  document.getElementById('statKasir').textContent = semuaKaryawan.filter(k => k.role === 'kasir' || !k.role).length;
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const fRole = document.getElementById('filterRole').value;
  const fStatus = document.getElementById('filterStatus').value;

  const filter = semuaKaryawan.filter(k => {
    const cocokSearch = (k.nama || '').toLowerCase().includes(q) || (k.email || '').toLowerCase().includes(q);
    const cocokRole = fRole === 'all' || k.role === fRole;
    const cocokStatus = fStatus === 'all'
      || (fStatus === 'aktif' && k.is_active !== false)
      || (fStatus === 'nonaktif' && k.is_active === false);
    return cocokSearch && cocokRole && cocokStatus;
  });

  const container = document.getElementById('listKaryawan');
  if (filter.length === 0) {
    container.innerHTML = '<div class="card p-8 text-center text-slate-500">Tidak ada karyawan</div>';
    return;
  }

  container.innerHTML = filter.map(k => {
    const nama = k.nama || 'Belum Terdaftar';
    const role = k.role || 'kasir';
    const isAktif = k.is_active !== false;
    const avatarColors = {
      admin: 'linear-gradient(135deg, #ef4444, #f97316)',
      manager: 'linear-gradient(135deg, #f59e0b, #eab308)',
      kasir: 'linear-gradient(135deg, #e31e24, #b8171c)'
    };
    const inisial = nama.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const isSelf = k.id === user.id;

    return `
      <div class="card p-5 hover:border-red-500 transition">
        <div class="flex items-center gap-4">
          <div class="avatar" style="background: ${avatarColors[role]}">${inisial}</div>
          <div class="flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <h3 class="font-bold text-lg">${nama}</h3>
              ${isSelf ? '<span class="text-xs text-red-400 font-bold">(Anda)</span>' : ''}
              <span class="badge role-${role}">${role.toUpperCase()}</span>
              <span class="badge ${isAktif?'status-aktif':'status-nonaktif'}">${isAktif ? 'AKTIF' : 'NONAKTIF'}</span>
            </div>
            <p class="text-slate-400 text-sm mt-1">${k.email || '-'}</p>
          </div>
          <div class="text-right hidden md:block">
            <p class="text-xs text-slate-400">Transaksi</p>
            <p class="font-bold text-red-400">${k.totalTrx || 0}x</p>
            <p class="text-xs text-slate-400 mt-1">Omzet</p>
            <p class="font-bold text-green-400 text-sm">Rp ${(k.totalOmzet || 0).toLocaleString('id-ID')}</p>
          </div>
          <div class="flex flex-col gap-2">
            <button onclick="bukaEdit('${k.id}')" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm font-semibold">✏️ Edit</button>
            <button onclick="lihatDetail('${k.id}')" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm font-semibold">👁️ Detail</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', renderList);
document.getElementById('filterRole').addEventListener('change', renderList);
document.getElementById('filterStatus').addEventListener('change', renderList);

function bukaEdit(id) {
  karyawanEdit = semuaKaryawan.find(k => k.id === id);
  if (!karyawanEdit) return;
  document.getElementById('mEmail').textContent = karyawanEdit.email || '-';
  document.getElementById('mNama').value = karyawanEdit.nama || '';
  document.getElementById('mRole').value = karyawanEdit.role || 'kasir';
  document.getElementById('mStatus').value = String(karyawanEdit.is_active !== false);
  bukaModal('modalEdit');
}

async function simpanEdit() {
  if (!karyawanEdit) return;
  const nama = document.getElementById('mNama').value.trim();
  const role = document.getElementById('mRole').value;
  const isActive = document.getElementById('mStatus').value === 'true';

  if (!nama) return toast('Nama tidak boleh kosong', 'warning');
  if (karyawanEdit.id === user.id && !isActive) return toast('Anda tidak bisa menonaktifkan akun sendiri!', 'error');

  const { error } = await db.from('profiles').upsert({
    id: karyawanEdit.id, nama, role, is_active: isActive
  });
  if (error) return toast('Gagal: ' + error.message, 'error');
  toast('Data karyawan diperbarui', 'success');
  tutupModal('modalEdit');
  await loadKaryawan();
}

function lihatDetail(id) {
  const k = semuaKaryawan.find(x => x.id === id);
  if (!k) return;
  const nama = k.nama || 'Belum Terdaftar';
  const bergabung = k.created_at ? new Date(k.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';
  document.getElementById('detailContent').innerHTML = `
    <h3 class="text-2xl font-bold mb-4">👤 Detail Karyawan</h3>
    <div class="space-y-3 text-sm">
      <div class="flex justify-between border-b border-slate-700 pb-2"><span class="text-slate-400">Nama</span><span class="font-semibold">${nama}</span></div>
      <div class="flex justify-between border-b border-slate-700 pb-2"><span class="text-slate-400">Email</span><span class="font-semibold text-xs">${k.email || '-'}</span></div>
      <div class="flex justify-between border-b border-slate-700 pb-2"><span class="text-slate-400">Role</span><span class="font-semibold uppercase">${k.role || 'kasir'}</span></div>
      <div class="flex justify-between border-b border-slate-700 pb-2"><span class="text-slate-400">Status</span><span class="font-semibold ${k.is_active !== false ? 'text-green-400' : 'text-slate-400'}">${k.is_active !== false ? 'Aktif' : 'Nonaktif'}</span></div>
      <div class="flex justify-between border-b border-slate-700 pb-2"><span class="text-slate-400">Bergabung</span><span class="font-semibold">${bergabung}</span></div>
      <div class="flex justify-between border-b border-slate-700 pb-2"><span class="text-slate-400">Total Transaksi</span><span class="font-semibold text-red-400">${k.totalTrx || 0}x</span></div>
      <div class="flex justify-between"><span class="text-slate-400">Total Omzet</span><span class="font-semibold text-green-400">Rp ${(k.totalOmzet || 0).toLocaleString('id-ID')}</span></div>
    </div>`;
  bukaModal('modalDetail');
}

function bukaModal(id) { document.getElementById(id).classList.remove('hidden'); }
function tutupModal(id) { document.getElementById(id).classList.add('hidden'); }
</script>
</body>
</html>

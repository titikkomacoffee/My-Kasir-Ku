<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi — KASIR PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e31e24">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <style>
    *{font-family:'Inter',sans-serif}body{background:#0f172a;color:white}
    .sidebar{background:#1e293b}
    .menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;color:#94a3b8;transition:all 0.2s;cursor:pointer;text-decoration:none}
    .menu-item:hover,.menu-item.active{background:linear-gradient(135deg,#e31e24 0%,#b8171c 100%);color:white;transform:translateX(4px)}
    .card{background:#1e293b;border:1px solid #334155;border-radius:20px}
    .sidebar-desktop{width:256px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:transform 0.3s ease;z-index:40}
    .main-content{margin-left:256px;padding:32px;min-height:100vh;transition:margin-left 0.3s ease}
    .btn-hamburger{display:none;position:fixed;top:16px;left:16px;z-index:45;width:48px;height:48px;border-radius:12px;background:#1e293b;border:1px solid #334155;color:white;font-size:22px;cursor:pointer;align-items:center;justify-content:center;transition:all 0.2s}
    .btn-hamburger:hover{background:#e31e24;border-color:#e31e24}
    #sidebarOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:39}
    @media (max-width:1023px){
      .sidebar-desktop{transform:translateX(-100%);box-shadow:10px 0 30px rgba(0,0,0,0.5)}
      .sidebar-desktop.sidebar-open{transform:translateX(0)}
      .main-content{margin-left:0;padding:80px 20px 20px 20px}
      .btn-hamburger{display:flex}
    }
    @media (max-width:639px){
      .main-content{padding:76px 16px 16px 16px}
      h1.text-3xl{font-size:22px}
      button,.menu-item{min-height:44px}
    }
  </style>
</head>
<body>

<button class="btn-hamburger" onclick="toggleSidebar()">☰</button>
<div id="sidebarOverlay" class="hidden" onclick="closeSidebar()"></div>

<div class="flex min-h-screen">
  <aside id="mainSidebar" class="sidebar-desktop sidebar p-4 flex flex-col">
    <div class="flex items-center gap-3 px-4 py-4 mb-2">
      <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center overflow-hidden flex-shrink-0">
        <img src="assets/logo.png" alt="KASIR PRO" class="w-full h-full object-contain p-1"
          onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:24px\'>🛒</div>'">
      </div>
      <div>
        <h1 class="font-extrabold text-base leading-tight">KASIR <span class="text-red-500">PRO</span></h1>
        <p class="text-xs text-slate-400">Point of Sale</p>
      </div>
    </div>
    <div class="px-4 mb-4 pb-4 border-b border-slate-700">
      <p id="sidebarNama" class="font-semibold text-sm truncate">...</p>
      <p id="sidebarRole" class="text-xs font-bold">...</p>
    </div>
    <nav class="flex-1 space-y-1">
      <a href="dashboard.html" class="menu-item">📊 <span>Dashboard</span></a>
      <a href="kasir.html" class="menu-item">💰 <span>Kasir (POS)</span></a>
      <a href="produk.html" id="menu-produk" class="menu-item">📦 <span>Produk & Stok</span></a>
      <a href="laporan.html" id="menu-laporan" class="menu-item">📈 <span>Laporan</span></a>
      <a href="piutang.html" class="menu-item">💳 <span>Piutang</span></a>
      <a href="shift.html" class="menu-item">⏰ <span>Shift Kasir</span></a>
      <a href="absensi.html" class="menu-item active">📸 <span>Absensi</span></a>
      <a href="karyawan.html" id="menu-karyawan" class="menu-item">👥 <span>Karyawan</span></a>
      <a href="pengaturan.html" id="menu-pengaturan" class="menu-item">⚙️ <span>Pengaturan</span></a>
    </nav>
    <div class="pt-4 border-t border-slate-700 space-y-1">
      <button onclick="pilihTema()" class="menu-item w-full text-left">🎨 <span>Ganti Tema</span></button>
      <button onclick="toggleMode()" class="menu-item w-full text-left">🌓 <span>Mode</span></button>
      <button onclick="logout()" class="menu-item w-full text-left text-red-400">🚪 <span>Logout</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-6">
      <h1 class="text-2xl md:text-3xl font-bold">📸 Absensi</h1>
      <a href="dashboard.html" class="px-4 py-2 bg-slate-700 rounded-lg text-sm">← Dashboard</a>
    </div>

    <div class="card p-4 md:p-6 mb-6">
      <video id="video" autoplay playsinline class="w-full rounded-xl bg-black"></video>
      <canvas id="canvas" class="hidden"></canvas>
      <p id="lokasi" class="mt-4 text-slate-400 text-xs md:text-sm">📍 Mendapatkan lokasi...</p>
      <p id="waktu" class="text-slate-400 text-xs md:text-sm">🕐 -</p>
      <div class="flex flex-col sm:flex-row gap-3 mt-6">
        <button onclick="absen('masuk')" class="flex-1 py-3 md:py-4 rounded-xl bg-gradient-to-r from-green-500 to-emerald-500 font-bold text-base md:text-lg">✅ Absen Masuk</button>
        <button onclick="absen('keluar')" class="flex-1 py-3 md:py-4 rounded-xl bg-gradient-to-r from-orange-500 to-red-500 font-bold text-base md:text-lg">🚪 Absen Keluar</button>
      </div>
    </div>

    <div class="card p-4 md:p-6">
      <h2 class="font-bold mb-4 text-base md:text-lg">Riwayat Absensi Hari Ini</h2>
      <div id="riwayat"></div>
    </div>
  </main>
</div>

<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script>
  let user, video, canvas, lokasiData;

  (async () => {
    const profil = await guard();
    if (!profil) return;
    user = profil;

    setInterval(() => {
      document.getElementById('waktu').textContent = '🕐 ' + new Date().toLocaleString('id-ID');
    }, 1000);

    video = document.getElementById('video');
    canvas = document.getElementById('canvas');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;
    } catch (e) {
      toast('Tidak bisa akses kamera: ' + e.message, 'error');
    }

    navigator.geolocation.getCurrentPosition(
      pos => {
        lokasiData = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        document.getElementById('lokasi').textContent = `📍 ${lokasiData.lat.toFixed(6)}, ${lokasiData.lng.toFixed(6)}`;
      },
      err => document.getElementById('lokasi').textContent = '❌ Gagal akses GPS: ' + err.message,
      { enableHighAccuracy: true }
    );

    loadRiwayat();
  })();

  async function absen(tipe) {
    if (!lokasiData) return toast('Lokasi belum terdeteksi', 'warning');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    canvas.toBlob(async blob => {
      const fileName = `${user.id}_${Date.now()}.jpg`;
      const { error: upErr } = await db.storage.from('absensi-foto').upload(fileName, blob);
      if (upErr) return toast('Upload gagal: ' + upErr.message, 'error');

      const { data: { publicUrl } } = db.storage.from('absensi-foto').getPublicUrl(fileName);
      await db.from('attendance').insert({
        user_id: user.id, foto_url: publicUrl,
        latitude: lokasiData.lat, longitude: lokasiData.lng, tipe
      });
      toast(`Absen ${tipe} berhasil!`, 'success');
      loadRiwayat();
    }, 'image/jpeg', 0.8);
  }

  async function loadRiwayat() {
    const today = new Date().toISOString().split('T')[0];
    const { data } = await db.from('attendance').select('*').eq('user_id', user.id)
      .gte('created_at', today + 'T00:00:00').order('created_at', { ascending: false });
    document.getElementById('riwayat').innerHTML = (data||[]).map(a => `
      <div class="flex items-center gap-3 py-3 border-b border-slate-700">
        <img src="${a.foto_url}" class="w-12 h-12 rounded-lg object-cover flex-shrink-0">
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-sm ${a.tipe==='masuk'?'text-green-400':'text-orange-400'}">${a.tipe.toUpperCase()}</p>
          <p class="text-xs text-slate-400 truncate">${new Date(a.created_at).toLocaleString('id-ID')}</p>
        </div>
      </div>`).join('') || '<p class="text-slate-500 text-center py-6">Belum ada absensi hari ini</p>';
  }
</script>
</body>
</html>

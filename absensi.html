<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><title>Absensi — KasirKu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>*{font-family:Inter,sans-serif}body{background:#0f172a;color:#fff}</style>
</head>
<body class="p-8">
  <div class="max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">📸 Absensi</h1>
      <a href="dashboard.html" class="px-4 py-2 bg-slate-700 rounded-lg">← Dashboard</a>
    </div>

    <div class="bg-slate-800 rounded-2xl p-6">
      <video id="video" autoplay playsinline class="w-full rounded-xl bg-black"></video>
      <canvas id="canvas" class="hidden"></canvas>

      <p id="lokasi" class="mt-4 text-slate-400 text-sm">📍 Mendapatkan lokasi...</p>
      <p id="waktu" class="text-slate-400 text-sm">🕐 -</p>

      <div class="flex gap-3 mt-6">
        <button onclick="absen('masuk')" class="flex-1 py-4 rounded-xl bg-gradient-to-r from-green-500 to-emerald-500 font-bold text-lg">✅ Absen Masuk</button>
        <button onclick="absen('keluar')" class="flex-1 py-4 rounded-xl bg-gradient-to-r from-orange-500 to-red-500 font-bold text-lg">🚪 Absen Keluar</button>
      </div>
    </div>

    <div class="bg-slate-800 rounded-2xl p-6 mt-6">
      <h2 class="font-bold mb-4">Riwayat Absensi Hari Ini</h2>
      <div id="riwayat"></div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    let user, video, canvas, lokasiData;

    (async () => {
      const { data: { user: u } } = await db.auth.getUser();
      if (!u) return window.location.href = 'index.html';
      user = u;

      // Set waktu realtime
      setInterval(() => {
        document.getElementById('waktu').textContent = '🕐 ' + new Date().toLocaleString('id-ID');
      }, 1000);

      // Kamera
      video = document.getElementById('video');
      canvas = document.getElementById('canvas');
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = stream;

      // GPS
      navigator.geolocation.getCurrentPosition(
        pos => {
          lokasiData = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          document.getElementById('lokasi').textContent = `📍 ${lokasiData.lat.toFixed(6)}, ${lokasiData.lng.toFixed(6)}`;
        },
        err => document.getElementById('lokasi').textContent = '❌ Gagal akses GPS: ' + err.message,
        { enableHighAccuracy: true }
      );

      loadRiwayat();
    })();

    async function absen(tipe) {
      if (!lokasiData) return alert('Lokasi belum terdeteksi, tunggu sebentar');

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob(async blob => {
        const fileName = `${user.id}_${Date.now()}.jpg`;
        const { error: upErr } = await db.storage.from('absensi-foto').upload(fileName, blob);
        if (upErr) return alert('Upload gagal: ' + upErr.message);

        const { data: { publicUrl } } = db.storage.from('absensi-foto').getPublicUrl(fileName);

        await db.from('attendance').insert({
          user_id: user.id,
          foto_url: publicUrl,
          latitude: lokasiData.lat,
          longitude: lokasiData.lng,
          tipe
        });

        alert(`✅ Absen ${tipe} berhasil!`);
        loadRiwayat();
      }, 'image/jpeg', 0.8);
    }

    async function loadRiwayat() {
      const today = new Date().toISOString().split('T')[0];
      const { data } = await db.from('attendance')
        .select('*').eq('user_id', user.id)
        .gte('created_at', today + 'T00:00:00')
        .order('created_at', { ascending: false });
      document.getElementById('riwayat').innerHTML = (data||[]).map(a => `
        <div class="flex items-center gap-3 py-3 border-b border-slate-700">
          <img src="${a.foto_url}" class="w-12 h-12 rounded-lg object-cover">
          <div class="flex-1">
            <p class="font-semibold ${a.tipe==='masuk'?'text-green-400':'text-orange-400'}">${a.tipe.toUpperCase()}</p>
            <p class="text-xs text-slate-400">${new Date(a.created_at).toLocaleString('id-ID')}</p>
          </div>
        </div>`).join('') || '<p class="text-slate-500">Belum ada absensi hari ini</p>';
    }
  </script>
</body>
</html>

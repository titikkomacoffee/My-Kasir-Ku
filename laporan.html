<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Laporan — KASIR PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e31e24">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <style>
    *{font-family:'Inter',sans-serif}body{background:#0f172a;color:white}
    .sidebar{background:#1e293b}
    .menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;color:#94a3b8;transition:all 0.2s;cursor:pointer;text-decoration:none}
    .menu-item:hover,.menu-item.active{background:linear-gradient(135deg,#e31e24 0%,#b8171c 100%);color:white;transform:translateX(4px)}
    .card{background:#1e293b;border:1px solid #334155;border-radius:20px}
    .sidebar-desktop{width:256px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:transform 0.3s ease;z-index:40}
    .main-content{margin-left:256px;padding:32px;min-height:100vh;transition:margin-left 0.3s ease}
    .btn-hamburger{display:none;position:fixed;top:16px;left:16px;z-index:45;width:48px;height:48px;border-radius:12px;background:#1e293b;border:1px solid #334155;color:white;font-size:22px;cursor:pointer;align-items:center;justify-content:center;transition:all 0.2s}
    .btn-hamburger:hover{background:#e31e24;border-color:#e31e24}
    #sidebarOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:39}
    @media (max-width:1023px){
      .sidebar-desktop{transform:translateX(-100%);box-shadow:10px 0 30px rgba(0,0,0,0.5)}
      .sidebar-desktop.sidebar-open{transform:translateX(0)}
      .main-content{margin-left:0;padding:80px 20px 20px 20px}
      .btn-hamburger{display:flex}
    }
    @media (max-width:639px){
      .main-content{padding:76px 16px 16px 16px}
      h1.text-3xl{font-size:22px}
      button,.menu-item{min-height:44px}
    }
  </style>
</head>
<body>

<button class="btn-hamburger" onclick="toggleSidebar()">☰</button>
<div id="sidebarOverlay" class="hidden" onclick="closeSidebar()"></div>

<div class="flex min-h-screen">
  <aside id="mainSidebar" class="sidebar-desktop sidebar p-4 flex flex-col">
    <div class="flex items-center gap-3 px-4 py-4 mb-2">
      <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center overflow-hidden flex-shrink-0">
        <img src="assets/logo.png" alt="KASIR PRO" class="w-full h-full object-contain p-1"
          onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:24px\'>🛒</div>'">
      </div>
      <div>
        <h1 class="font-extrabold text-base leading-tight">KASIR <span class="text-red-500">PRO</span></h1>
        <p class="text-xs text-slate-400">Point of Sale</p>
      </div>
    </div>
    <div class="px-4 mb-4 pb-4 border-b border-slate-700">
      <p id="sidebarNama" class="font-semibold text-sm truncate">...</p>
      <p id="sidebarRole" class="text-xs font-bold">...</p>
    </div>
    <nav class="flex-1 space-y-1">
      <a href="dashboard.html" class="menu-item">📊 <span>Dashboard</span></a>
      <a href="kasir.html" class="menu-item">💰 <span>Kasir (POS)</span></a>
      <a href="produk.html" id="menu-produk" class="menu-item">📦 <span>Produk & Stok</span></a>
      <a href="laporan.html" class="menu-item active">📈 <span>Laporan</span></a>
      <a href="piutang.html" class="menu-item">💳 <span>Piutang</span></a>
      <a href="shift.html" class="menu-item">⏰ <span>Shift Kasir</span></a>
      <a href="absensi.html" class="menu-item">📸 <span>Absensi</span></a>
      <a href="karyawan.html" id="menu-karyawan" class="menu-item">👥 <span>Karyawan</span></a>
      <a href="pengaturan.html" id="menu-pengaturan" class="menu-item">⚙️ <span>Pengaturan</span></a>
    </nav>
    <div class="pt-4 border-t border-slate-700 space-y-1">
      <button onclick="pilihTema()" class="menu-item w-full text-left">🎨 <span>Ganti Tema</span></button>
      <button onclick="toggleMode()" class="menu-item w-full text-left">🌓 <span>Mode</span></button>
      <button onclick="logout()" class="menu-item w-full text-left text-red-400">🚪 <span>Logout</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-6">
      <h1 class="text-2xl md:text-3xl font-bold">📈 Laporan & Analisis</h1>
      <div class="flex gap-2">
        <a href="dashboard.html" class="px-4 py-2 bg-slate-700 rounded-lg text-sm">← Dashboard</a>
        <button onclick="exportCsv()" class="px-4 py-2 bg-green-600 hover:bg-green-500 rounded-lg font-semibold text-sm">📥 Export</button>
      </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
      <div class="card p-4 md:p-5"><p class="text-slate-400 text-xs md:text-sm">Omzet</p><p id="omzet" class="text-lg md:text-2xl font-bold text-red-500">Rp 0</p></div>
      <div class="card p-4 md:p-5"><p class="text-slate-400 text-xs md:text-sm">Transaksi</p><p id="trx" class="text-lg md:text-2xl font-bold text-red-400">0</p></div>
      <div class="card p-4 md:p-5"><p class="text-slate-400 text-xs md:text-sm">Rata-rata</p><p id="avg" class="text-lg md:text-2xl font-bold text-cyan-400">Rp 0</p></div>
      <div class="card p-4 md:p-5"><p class="text-slate-400 text-xs md:text-sm">Profit</p><p id="profit" class="text-lg md:text-2xl font-bold text-green-400">Rp 0</p></div>
    </div>

    <div class="card p-4 md:p-6 mb-6">
      <h2 class="font-bold mb-4 text-base md:text-lg">Grafik Tren 7 Hari</h2>
      <div style="height: 250px;">
        <canvas id="chart"></canvas>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
      <div class="card p-4 md:p-6">
        <h2 class="font-bold mb-4 text-base md:text-lg">🏆 Produk Terlaris</h2>
        <div id="terlaris"></div>
      </div>
      <div class="card p-4 md:p-6">
        <h2 class="font-bold mb-4 text-base md:text-lg">👤 Performa Kasir</h2>
        <div id="performaKasir"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script>
  let semuaTrx = [];

  (async () => {
    const profil = await guard(['admin', 'manager']);
    if (!profil) return;
    await load();
  })();

  async function load() {
    const { data: trxList } = await db.from('transactions').select('*').eq('status','selesai');
    semuaTrx = trxList || [];
    const omzet = semuaTrx.reduce((s,t)=>s+t.total,0);
    document.getElementById('omzet').textContent = 'Rp ' + omzet.toLocaleString('id-ID');
    document.getElementById('trx').textContent = semuaTrx.length;
    document.getElementById('avg').textContent = 'Rp ' + (semuaTrx.length?Math.round(omzet/semuaTrx.length):0).toLocaleString('id-ID');

    const { data: items } = await db.from('transaction_items').select('*');
    const { data: prods } = await db.from('products').select('id,harga_modal');
    const modalMap = Object.fromEntries((prods||[]).map(p=>[p.id,p.harga_modal||0]));
    const totalModal = (items||[]).reduce((s,i)=>s+((modalMap[i.product_id]||0)*i.qty),0);
    document.getElementById('profit').textContent = 'Rp ' + (omzet - totalModal).toLocaleString('id-ID');

    const days = [...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().split('T')[0];});
    const dataHarian = days.map(day => semuaTrx.filter(t=>t.created_at.startsWith(day)).reduce((s,t)=>s+t.total,0));

    new Chart(document.getElementById('chart'), {
      type:'line',
      data:{labels:days.map(d=>d.slice(5)),datasets:[{label:'Omzet',data:dataHarian,borderColor:'#e31e24',backgroundColor:'rgba(227,30,36,0.2)',tension:0.4,fill:true}]},
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{legend:{labels:{color:'#fff'}}},
        scales:{x:{ticks:{color:'#94a3b8'}},y:{ticks:{color:'#94a3b8'}}}
      }
    });

    const agg = {};
    (items||[]).forEach(i=>agg[i.nama_produk]=(agg[i.nama_produk]||0)+i.qty);
    const top = Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,5);
    document.getElementById('terlaris').innerHTML = top.map(([n,q],i)=>`
      <div class="flex justify-between py-2 border-b border-slate-700 text-sm">
        <span>${i+1}. ${n}</span><span class="font-bold text-red-400">${q} terjual</span>
      </div>`).join('') || '<p class="text-slate-500">Belum ada data</p>';

    const { data: profiles } = await db.from('profiles').select('id,nama');
    const perf = (profiles||[]).map(p=>({nama:p.nama,total:semuaTrx.filter(t=>t.kasir_id===p.id).reduce((s,t)=>s+t.total,0)}))
      .filter(p=>p.total>0).sort((a,b)=>b.total-a.total).slice(0,5);
    document.getElementById('performaKasir').innerHTML = perf.map(p=>`
      <div class="flex justify-between py-2 border-b border-slate-700 text-sm">
        <span>${p.nama}</span><span class="font-bold text-green-400">Rp ${p.total.toLocaleString('id-ID')}</span>
      </div>`).join('') || '<p class="text-slate-500">Belum ada data</p>';
  }

  async function exportCsv() {
    const { data: trxs } = await db.from('transactions')
      .select('nomor_trx, created_at, metode_bayar, subtotal, diskon, total, profiles(nama)')
      .eq('status', 'selesai').order('created_at', { ascending: false });

    if (!trxs || trxs.length === 0) return toast('Belum ada data untuk di-export', 'warning');

    const header = ['No. TRX', 'Tanggal', 'Kasir', 'Metode', 'Subtotal', 'Diskon', 'Total'];
    const rows = trxs.map(t => [
      t.nomor_trx,
      new Date(t.created_at).toLocaleString('id-ID'),
      t.profiles?.nama || '-',
      t.metode_bayar,
      t.subtotal, t.diskon, t.total
    ]);
    const csvContent = [header, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `laporan-kasirpro-${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
    URL.revokeObjectURL(url);
    toast('Laporan berhasil di-download', 'success');
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Produk — KASIR PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e31e24">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <style>
    *{font-family:'Inter',sans-serif}body{background:#0f172a;color:white}
    .sidebar{background:#1e293b}
    .menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;color:#94a3b8;transition:all 0.2s;cursor:pointer;text-decoration:none}
    .menu-item:hover,.menu-item.active{background:linear-gradient(135deg,#e31e24 0%,#b8171c 100%);color:white;transform:translateX(4px)}
    .card{background:#1e293b;border:1px solid #334155;border-radius:20px}
    .sidebar-desktop{width:256px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:transform 0.3s ease;z-index:40}
    .main-content{margin-left:256px;padding:32px;min-height:100vh;transition:margin-left 0.3s ease}
    .btn-hamburger{display:none;position:fixed;top:16px;left:16px;z-index:45;width:48px;height:48px;border-radius:12px;background:#1e293b;border:1px solid #334155;color:white;font-size:22px;cursor:pointer;align-items:center;justify-content:center;transition:all 0.2s}
    .btn-hamburger:hover{background:#e31e24;border-color:#e31e24}
    #sidebarOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:39}
    @media (max-width:1023px){
      .sidebar-desktop{transform:translateX(-100%);box-shadow:10px 0 30px rgba(0,0,0,0.5)}
      .sidebar-desktop.sidebar-open{transform:translateX(0)}
      .main-content{margin-left:0;padding:80px 20px 20px 20px}
      .btn-hamburger{display:flex}
    }
    @media (max-width:639px){
      .main-content{padding:76px 16px 16px 16px}
      h1.text-3xl{font-size:22px}
      button,.menu-item{min-height:44px}
      .table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
      .table-wrapper table{min-width:600px}
    }
  </style>
</head>
<body>

<button class="btn-hamburger" onclick="toggleSidebar()">☰</button>
<div id="sidebarOverlay" class="hidden" onclick="closeSidebar()"></div>

<div class="flex min-h-screen">
  <aside id="mainSidebar" class="sidebar-desktop sidebar p-4 flex flex-col">
    <div class="flex items-center gap-3 px-4 py-4 mb-2">
      <div class="w-12 h-12 rounded-xl bg-white flex items-center justify-center overflow-hidden flex-shrink-0">
        <img src="assets/logo.png" alt="KASIR PRO" class="w-full h-full object-contain p-1"
          onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:24px\'>🛒</div>'">
      </div>
      <div>
        <h1 class="font-extrabold text-base leading-tight">KASIR <span class="text-red-500">PRO</span></h1>
        <p class="text-xs text-slate-400">Point of Sale</p>
      </div>
    </div>
    <div class="px-4 mb-4 pb-4 border-b border-slate-700">
      <p id="sidebarNama" class="font-semibold text-sm truncate">...</p>
      <p id="sidebarRole" class="text-xs font-bold">...</p>
    </div>
    <nav class="flex-1 space-y-1">
      <a href="dashboard.html" class="menu-item">📊 <span>Dashboard</span></a>
      <a href="kasir.html" class="menu-item">💰 <span>Kasir (POS)</span></a>
      <a href="produk.html" class="menu-item active">📦 <span>Produk & Stok</span></a>
      <a href="laporan.html" id="menu-laporan" class="menu-item">📈 <span>Laporan</span></a>
      <a href="piutang.html" class="menu-item">💳 <span>Piutang</span></a>
      <a href="shift.html" class="menu-item">⏰ <span>Shift Kasir</span></a>
      <a href="absensi.html" class="menu-item">📸 <span>Absensi</span></a>
      <a href="karyawan.html" id="menu-karyawan" class="menu-item">👥 <span>Karyawan</span></a>
      <a href="pengaturan.html" id="menu-pengaturan" class="menu-item">⚙️ <span>Pengaturan</span></a>
    </nav>
    <div class="pt-4 border-t border-slate-700 space-y-1">
      <button onclick="pilihTema()" class="menu-item w-full text-left">🎨 <span>Ganti Tema</span></button>
      <button onclick="toggleMode()" class="menu-item w-full text-left">🌓 <span>Mode</span></button>
      <button onclick="logout()" class="menu-item w-full text-left text-red-400">🚪 <span>Logout</span></button>
    </div>
  </aside>

  <main class="main-content">
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-6">
      <h1 class="text-2xl md:text-3xl font-bold">📦 Produk & Stok</h1>
      <div class="flex gap-2">
        <a href="dashboard.html" class="px-4 py-2 bg-slate-700 rounded-lg text-sm">← Dashboard</a>
        <button onclick="tambahProduk()" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg font-bold text-sm">+ Tambah</button>
      </div>
    </div>

    <div class="card p-4 md:p-6">
      <div class="grid grid-cols-2 gap-3 md:gap-4 mb-4">
        <div class="bg-slate-900 p-4 rounded-xl">
          <p class="text-slate-400 text-xs md:text-sm">Total Jenis Produk</p>
          <p id="totalJenis" class="text-2xl md:text-3xl font-bold text-red-500">0</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-xl">
          <p class="text-slate-400 text-xs md:text-sm">Total Kuantitas Stok</p>
          <p id="totalStok" class="text-2xl md:text-3xl font-bold text-cyan-400">0</p>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="w-full text-left text-sm">
          <thead class="text-slate-400 border-b border-slate-700">
            <tr><th class="py-3">Nama</th><th>SKU</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr>
          </thead>
          <tbody id="tabelProduk"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script>
  (async () => {
    const profil = await guard(['admin', 'manager']);
    if (!profil) return;
    await load();
  })();

  async function load() {
    const { data } = await db.from('products').select('*').order('created_at', {ascending:false});
    const list = data || [];
    document.getElementById('totalJenis').textContent = list.length;
    document.getElementById('totalStok').textContent = list.reduce((s,p)=>s+p.stok,0);
    document.getElementById('tabelProduk').innerHTML = list.map(p => `
      <tr class="border-b border-slate-800">
        <td class="py-3">${p.nama}</td>
        <td class="text-slate-400">${p.sku||'-'}</td>
        <td>Rp ${p.harga.toLocaleString('id-ID')}</td>
        <td class="${p.stok<5?'text-red-400 font-bold':''}">${p.stok}</td>
        <td>
          <button onclick="editProduk('${p.id}')" class="text-blue-400 mr-2">Edit</button>
          <button onclick="hapusProduk('${p.id}')" class="text-red-400">Hapus</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="5" class="text-center py-8 text-slate-500">Belum ada produk</td></tr>';
  }

  async function tambahProduk() {
    const nama = prompt('Nama produk:');
    if (!nama) return;
    const sku = prompt('SKU (boleh kosong):') || null;
    const harga = parseInt(prompt('Harga jual:')) || 0;
    const stok = parseInt(prompt('Stok awal:')) || 0;
    const { error } = await db.from('products').insert({ nama, sku, harga, stok });
    if (error) return toast(error.message, 'error');
    toast('Produk berhasil ditambahkan', 'success');
    load();
  }

  async function hapusProduk(id) {
    if (!await konfirmasi('Hapus produk ini?', 'Hapus Produk')) return;
    await db.from('products').delete().eq('id', id);
    toast('Produk dihapus', 'success');
    load();
  }

  async function editProduk(id) {
    const { data: p } = await db.from('products').select('*').eq('id', id).single();
    const nama = prompt('Nama:', p.nama) || p.nama;
    const harga = parseInt(prompt('Harga:', p.harga)) || p.harga;
    const stokInput = prompt('Stok:', p.stok);
    const stok = stokInput === null ? p.stok : (parseInt(stokInput) || 0);
    await db.from('products').update({ nama, harga, stok }).eq('id', id);
    toast('Produk diperbarui', 'success');
    load();
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login — KASIR PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#14b8a6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KASIR PRO">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #ccfbf1 0%, #f0fdfa 50%, #ffffff 100%);
      min-height: 100vh;
      position: relative;
      color: #0f172a;
    }
    body::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 80% 10%, rgba(20, 184, 166, 0.15), transparent 50%);
      pointer-events: none;
    }
    .glass {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(20, 184, 166, 0.1);
      box-shadow: 0 20px 60px rgba(20, 184, 166, 0.15);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(20, 184, 166, 0.3);
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(20, 184, 166, 0.4);
    }
    .logo-box {
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      padding: 16px;
      border-radius: 24px;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(20, 184, 166, 0.3);
    }
    .logo-box img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      display: block;
    }
    .brand-name {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0f172a;
      margin-top: 16px;
    }
    .brand-name span { color: #14b8a6; }
    .brand-tagline {
      font-size: 10px;
      letter-spacing: 4px;
      color: #64748b;
      font-weight: 600;
      margin-top: 6px;
    }
    .btn-loading { pointer-events: none; opacity: 0.7; }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tab-btn { transition: all 0.2s; }
    .tab-active {
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
    }
    input:focus { border-color: #14b8a6 !important; }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="glass rounded-3xl p-6 md:p-8 w-full max-w-md" style="position: relative; z-index: 1;">
    <div class="text-center mb-6 md:mb-8">
      <div class="logo-box">
        <img src="assets/logo.png" alt="KASIR PRO"
          onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size:60px;color:white\'>🛒</div>'">
      </div>
      <h1 class="brand-name">KASIR <span>PRO</span></h1>
      <p class="brand-tagline">APLIKASI POINT OF SALE</p>
    </div>

    <div class="flex gap-2 mb-6 bg-teal-50 p-1 rounded-2xl">
      <button id="tabLogin" onclick="gantiTab('login')" class="tab-btn tab-active flex-1 py-2.5 rounded-xl font-bold text-sm">Masuk</button>
      <button id="tabDaftar" onclick="gantiTab('daftar')" class="tab-btn flex-1 py-2.5 rounded-xl font-bold text-sm text-slate-500">Daftar</button>
    </div>

    <form id="formLogin" class="space-y-4">
      <div>
        <label class="text-slate-700 text-sm font-semibold mb-2 block">Email</label>
        <input type="email" id="loginEmail" required
          class="w-full px-4 py-3.5 rounded-2xl bg-white border-2 border-slate-200 text-slate-800 focus:outline-none transition"
          placeholder="kasir@tokopro.com">
      </div>
      <div>
        <label class="text-slate-700 text-sm font-semibold mb-2 block">Password</label>
        <input type="password" id="loginPassword" required
          class="w-full px-4 py-3.5 rounded-2xl bg-white border-2 border-slate-200 text-slate-800 focus:outline-none transition"
          placeholder="••••••••">
      </div>
      <button type="submit" id="btnLogin" class="w-full btn-gradient text-white font-bold py-3.5 rounded-2xl">Masuk</button>
    </form>

    <form id="formDaftar" class="space-y-4 hidden">
      <div>
        <label class="text-slate-700 text-sm font-semibold mb-2 block">Nama Lengkap</label>
        <input type="text" id="daftarNama" required
          class="w-full px-4 py-3.5 rounded-2xl bg-white border-2 border-slate-200 text-slate-800 focus:outline-none transition"
          placeholder="Budi Santoso">
      </div>
      <div>
        <label class="text-slate-700 text-sm font-semibold mb-2 block">Email</label>
        <input type="email" id="daftarEmail" required
          class="w-full px-4 py-3.5 rounded-2xl bg-white border-2 border-slate-200 text-slate-800 focus:outline-none transition"
          placeholder="kasir@tokopro.com">
      </div>
      <div>
        <label class="text-slate-700 text-sm font-semibold mb-2 block">Password</label>
        <input type="password" id="daftarPassword" required minlength="6"
          class="w-full px-4 py-3.5 rounded-2xl bg-white border-2 border-slate-200 text-slate-800 focus:outline-none transition"
          placeholder="Min 6 karakter">
      </div>
      <button type="submit" id="btnDaftar" class="w-full btn-gradient text-white font-bold py-3.5 rounded-2xl">Daftar</button>
    </form>

    <p id="pesan" class="text-center mt-4 text-sm"></p>
    <p class="text-center text-xs text-slate-400 mt-6">© 2025 KASIR PRO — v2.0</p>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script>
    function gantiTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('formLogin').classList.toggle('hidden', !isLogin);
      document.getElementById('formDaftar').classList.toggle('hidden', isLogin);
      document.getElementById('tabLogin').className = isLogin
        ? 'tab-btn tab-active flex-1 py-2.5 rounded-xl font-bold text-sm'
        : 'tab-btn flex-1 py-2.5 rounded-xl font-bold text-sm text-slate-500';
      document.getElementById('tabDaftar').className = !isLogin
        ? 'tab-btn tab-active flex-1 py-2.5 rounded-xl font-bold text-sm'
        : 'tab-btn flex-1 py-2.5 rounded-xl font-bold text-sm text-slate-500';
      document.getElementById('pesan').textContent = '';
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const pesan = document.getElementById('pesan');
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      btn.classList.add('btn-loading');
      btn.innerHTML = '<span class="spinner"></span>Memproses...';
      pesan.textContent = '';

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        btn.classList.remove('btn-loading');
        btn.innerHTML = 'Masuk';
        pesan.textContent = '❌ ' + error.message;
        pesan.className = 'text-center mt-4 text-sm text-red-500';
        return;
      }

      const { data: profil } = await db.from('profiles').select('is_active').eq('id', data.user.id).single();
      if (profil && profil.is_active === false) {
        await db.auth.signOut();
        btn.classList.remove('btn-loading');
        btn.innerHTML = 'Masuk';
        pesan.textContent = '❌ Akun dinonaktifkan';
        pesan.className = 'text-center mt-4 text-sm text-red-500';
        return;
      }

      hapusCacheProfil();
      btn.innerHTML = '<span class="spinner"></span>Berhasil!';
      pesan.textContent = '✅ Login berhasil!';
      pesan.className = 'text-center mt-4 text-sm text-teal-600';
      setTimeout(() => window.location.href = 'dashboard.html', 400);
    });

    document.getElementById('formDaftar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnDaftar');
      const pesan = document.getElementById('pesan');
      const nama = document.getElementById('daftarNama').value.trim();
      const email = document.getElementById('daftarEmail').value;
      const password = document.getElementById('daftarPassword').value;

      if (password.length < 6) {
        pesan.textContent = '❌ Password minimal 6 karakter';
        pesan.className = 'text-center mt-4 text-sm text-red-500';
        return;
      }

      btn.classList.add('btn-loading');
      btn.innerHTML = '<span class="spinner"></span>Mendaftar...';
      pesan.textContent = '';

      const { data, error } = await db.auth.signUp({
        email, password, options: { data: { nama } }
      });

      if (error) {
        btn.classList.remove('btn-loading');
        btn.innerHTML = 'Daftar';
        pesan.textContent = '❌ ' + error.message;
        pesan.className = 'text-center mt-4 text-sm text-red-500';
        return;
      }

      if (data.user) await db.from('profiles').update({ nama }).eq('id', data.user.id);

      btn.classList.remove('btn-loading');
      btn.innerHTML = 'Daftar';
      pesan.textContent = '✅ Pendaftaran berhasil! Silakan login.';
      pesan.className = 'text-center mt-4 text-sm text-teal-600';

      setTimeout(() => {
        gantiTab('login');
        document.getElementById('loginEmail').value = email;
        document.getElementById('loginPassword').focus();
      }, 1200);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

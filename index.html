<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — KasirKu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .glow {
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
    }
    .btn-gradient {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="glass glow rounded-3xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-20 h-20 mx-auto mb-4 rounded-2xl btn-gradient flex items-center justify-center text-4xl">
        🛒
      </div>
      <h1 class="text-3xl font-extrabold text-white">KasirKu</h1>
      <p class="text-slate-400 mt-2">Manajemen Bisnis Modern</p>
    </div>

    <form id="formLogin" class="space-y-4">
      <div>
        <label class="text-slate-300 text-sm font-semibold mb-2 block">Email</label>
        <input type="email" id="email" required
          class="w-full px-4 py-3 rounded-xl bg-slate-800/50 border border-slate-700 text-white focus:border-purple-500 focus:outline-none transition"
          placeholder="kasir@toko.com">
      </div>
      <div>
        <label class="text-slate-300 text-sm font-semibold mb-2 block">Password</label>
        <input type="password" id="password" required
          class="w-full px-4 py-3 rounded-xl bg-slate-800/50 border border-slate-700 text-white focus:border-purple-500 focus:outline-none transition"
          placeholder="••••••••">
      </div>
      <button type="submit"
        class="w-full btn-gradient text-white font-bold py-3 rounded-xl">
        Masuk
      </button>
      <p class="text-center text-slate-400 text-sm">
        Belum punya akun? <a href="#" id="linkDaftar" class="text-purple-400 hover:underline">Daftar</a>
      </p>
    </form>

    <p id="pesan" class="text-center mt-4 text-sm"></p>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const pesan = document.getElementById('pesan');
      pesan.textContent = 'Memproses...';
      pesan.className = 'text-center mt-4 text-sm text-slate-400';

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        pesan.textContent = '❌ ' + error.message;
        pesan.className = 'text-center mt-4 text-sm text-red-400';
        return;
      }
      pesan.textContent = '✅ Login berhasil!';
      pesan.className = 'text-center mt-4 text-sm text-green-400';
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    });

    // Daftar akun (buat akun baru)
    document.getElementById('linkDaftar').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = prompt('Email:');
      if (!email) return;
      const password = prompt('Password (min 6 karakter):');
      if (!password) return;

      const { error } = await db.auth.signUp({ email, password });
      if (error) return alert('Gagal: ' + error.message);
      alert('Akun berhasil dibuat! Silakan cek email untuk verifikasi (jika diaktifkan), atau langsung login.');
    });
  </script>
</body>
</html>

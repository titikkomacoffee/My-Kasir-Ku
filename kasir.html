<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kasir — KASIR PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#e31e24">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0f172a; color: white; }
    .produk-card {
      background: #1e293b; border-radius: 16px; padding: 12px;
      cursor: pointer; transition: all 0.2s; border: 1px solid #334155;
    }
    .produk-card:hover { transform: translateY(-4px); border-color: #e31e24; box-shadow: 0 10px 30px rgba(227,30,36,0.3); }
    .btn-bayar { background: linear-gradient(135deg, #e31e24 0%, #b8171c 100%); }
    .scroll-area { max-height: calc(100vh - 200px); overflow-y: auto; }
    .scroll-area::-webkit-scrollbar { width: 6px; }
    .scroll-area::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body>

<div class="flex h-screen">
  <div class="flex-1 p-6 flex flex-col">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-white flex items-center justify-center overflow-hidden">
          <img src="assets/logo.png" alt="KASIR PRO" class="w-full h-full object-contain p-1"
            onerror="this.style.display='none'; this.parentElement.innerHTML='🛒'">
        </div>
        <h1 class="text-2xl font-bold">Kasir <span class="text-red-500">PRO</span></h1>
      </div>
      <a href="dashboard.html" class="text-slate-400 hover:text-white">← Dashboard</a>
    </div>

    <input type="text" id="search" placeholder="🔍 Cari produk..."
      class="w-full px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white mb-4 focus:border-red-500 focus:outline-none">

    <div id="kategoriBar" class="flex gap-2 mb-4 flex-wrap"></div>
    <div id="produkList" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 scroll-area"></div>
  </div>

  <div class="w-96 bg-slate-800 p-6 flex flex-col">
    <h2 class="text-xl font-bold mb-4">🛒 Keranjang</h2>
    <div id="keranjangList" class="flex-1 scroll-area space-y-2 mb-4"></div>

    <div class="border-t border-slate-700 pt-4 space-y-2 text-sm">
      <div class="flex justify-between"><span class="text-slate-400">Subtotal</span><span id="subtotal">Rp 0</span></div>
      <div class="flex justify-between">
        <span class="text-slate-400">Diskon</span>
        <input type="number" id="diskon" value="0" min="0"
          class="w-24 px-2 py-1 rounded bg-slate-900 border border-slate-700 text-right text-white text-sm">
      </div>
      <div class="flex justify-between font-bold text-xl pt-2 border-t border-slate-700">
        <span>Total</span><span id="total" class="text-red-500">Rp 0</span>
      </div>
    </div>

    <div class="mt-4 space-y-2">
      <button onclick="simpanHold()" class="w-full py-3 rounded-xl bg-slate-700 hover:bg-slate-600 font-semibold text-sm">📥 Hold Bill</button>
      <button onclick="bayar()" class="w-full py-4 rounded-xl btn-bayar font-bold text-lg">💳 Bayar</button>
    </div>
  </div>
</div>

<div id="modalBayar" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
    <h3 class="text-2xl font-bold mb-4">Pembayaran</h3>
    <p class="text-slate-400">Total</p>
    <p id="modalTotal" class="text-3xl font-extrabold text-red-500 mb-6">Rp 0</p>

    <label class="text-sm text-slate-400">Metode Bayar</label>
    <div class="grid grid-cols-3 gap-2 my-3">
      <button onclick="pilihMetode('cash')" id="mCash" class="py-3 rounded-xl bg-slate-700 font-semibold">💵 Cash</button>
      <button onclick="pilihMetode('qris')" id="mQris" class="py-3 rounded-xl bg-slate-700 font-semibold">📱 QRIS</button>
      <button onclick="pilihMetode('piutang')" id="mPiutang" class="py-3 rounded-xl bg-slate-700 font-semibold">📝 Piutang</button>
    </div>

    <div id="inputCash" class="mt-4">
      <label class="text-sm text-slate-400">Uang Diterima</label>
      <input type="number" id="uangBayar" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white mt-1 text-2xl font-bold">
      <p class="text-sm mt-2">Kembalian: <span id="kembalian" class="font-bold text-green-400">Rp 0</span></p>
    </div>

    <div id="inputQris" class="mt-4 hidden text-center">
      <p class="text-sm text-slate-400 mb-2">Tunjukkan QR ini ke pelanggan:</p>
      <div id="qrisPreview" class="inline-block bg-white p-3 rounded-xl">
        <div class="w-56 h-56 bg-slate-200 rounded flex items-center justify-center text-slate-500">Loading...</div>
      </div>
      <p class="text-xs text-slate-400 mt-2">Total: <span id="qrisTotal" class="font-bold text-red-400">Rp 0</span></p>
      <p class="text-xs text-red-400 mt-1">✅ Klik Konfirmasi setelah pelanggan selesai bayar</p>
    </div>

    <div id="inputPiutang" class="mt-4 hidden">
      <label class="text-sm text-slate-400">Nama Pelanggan</label>
      <input type="text" id="namaPelanggan" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white mt-1">
      <label class="text-sm text-slate-400 mt-3 block">Jatuh Tempo</label>
      <input type="date" id="jatuhTempo" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white mt-1">
    </div>

    <div class="flex gap-2 mt-6">
      <button onclick="tutupModalBayar()" class="flex-1 py-3 rounded-xl bg-slate-700 font-semibold">Batal</button>
      <button onclick="konfirmasiBayar()" class="flex-1 py-3 rounded-xl btn-bayar font-bold">Konfirmasi</button>
    </div>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script>
let keranjang = [];
let produkAll = [];
let kategoriAll = [];
let kategoriAktif = 'all';
let metodePilih = 'cash';
let user;

(async () => {
  const profil = await guard();
  if (!profil) return;
  user = profil;

  const { data: shiftCek } = await db.from('shifts')
    .select('id').eq('kasir_id', profil.id).eq('status', 'open').maybeSingle();
  if (!shiftCek) {
    await konfirmasi('Anda belum membuka shift. Silakan buka shift dulu.', 'Shift Belum Dibuka');
    window.location.href = 'shift.html';
    return;
  }

  const { data: kat } = await db.from('categories').select('*');
  kategoriAll = kat || [];
  renderKategori();

  const { data: prod } = await db.from('products').select('*').eq('is_active', true);
  produkAll = prod || [];
  renderProduk();
})();

function renderKategori() {
  const bar = document.getElementById('kategoriBar');
  bar.innerHTML = `<button onclick="setKategori('all')" class="px-4 py-2 rounded-full ${kategoriAktif==='all'?'bg-red-500':'bg-slate-700'} text-sm font-semibold">Semua</button>`;
  kategoriAll.forEach(k => {
    bar.innerHTML += `<button onclick="setKategori('${k.id}')" class="px-4 py-2 rounded-full ${kategoriAktif===k.id?'bg-red-500':'bg-slate-700'} text-sm font-semibold">${k.icon||''} ${k.nama}</button>`;
  });
}

function setKategori(id) { kategoriAktif = id; renderKategori(); renderProduk(); }

function renderProduk() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('produkList');
  const filter = produkAll.filter(p =>
    (kategoriAktif === 'all' || p.category_id === kategoriAktif) &&
    p.nama.toLowerCase().includes(q)
  );
  list.innerHTML = filter.map(p => `
    <div onclick="tambahItem('${p.id}')" class="produk-card">
      <div class="text-3xl mb-2 text-center">${p.foto_url ? `<img src="${p.foto_url}" class="w-full h-20 object-cover rounded-lg">` : '📦'}</div>
      <p class="font-semibold text-sm truncate">${p.nama}</p>
      <p class="text-red-400 font-bold text-sm mt-1">Rp ${p.harga.toLocaleString('id-ID')}</p>
      <p class="text-xs text-slate-500">Stok: ${p.stok}</p>
    </div>
  `).join('') || '<p class="text-slate-500 col-span-full text-center py-8">Tidak ada produk</p>';
}

document.getElementById('search').addEventListener('input', renderProduk);

function tambahItem(id) {
  const p = produkAll.find(x => x.id === id);
  const item = keranjang.find(x => x.product_id === id);
  if (item) {
    if (item.qty + 1 > p.stok) return toast('Stok tidak cukup!', 'warning');
    item.qty++;
    item.subtotal = item.qty * item.harga;
  } else {
    if (p.stok < 1) return toast('Stok habis!', 'error');
    keranjang.push({ product_id: p.id, nama_produk: p.nama, harga: p.harga, qty: 1, subtotal: p.harga });
  }
  renderKeranjang();
}

function ubahQty(id, delta) {
  const item = keranjang.find(x => x.product_id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) keranjang = keranjang.filter(x => x.product_id !== id);
  else item.subtotal = item.qty * item.harga;
  renderKeranjang();
}

function renderKeranjang() {
  const list = document.getElementById('keranjangList');
  list.innerHTML = keranjang.map(i => `
    <div class="bg-slate-900 rounded-xl p-3 flex justify-between items-center">
      <div class="flex-1">
        <p class="font-semibold text-sm">${i.nama_produk}</p>
        <p class="text-xs text-slate-400">Rp ${i.harga.toLocaleString('id-ID')}</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="ubahQty('${i.product_id}',-1)" class="w-7 h-7 rounded-lg bg-slate-700 font-bold">−</button>
        <span class="w-8 text-center font-bold">${i.qty}</span>
        <button onclick="ubahQty('${i.product_id}',1)" class="w-7 h-7 rounded-lg bg-slate-700 font-bold">+</button>
      </div>
    </div>
  `).join('') || '<p class="text-slate-500 text-center py-8">Keranjang kosong</p>';
  hitungTotal();
}

function hitungTotal() {
  const subtotal = keranjang.reduce((s, i) => s + i.subtotal, 0);
  const diskon = parseInt(document.getElementById('diskon').value) || 0;
  document.getElementById('subtotal').textContent = 'Rp ' + subtotal.toLocaleString('id-ID');
  document.getElementById('total').textContent = 'Rp ' + (subtotal - diskon).toLocaleString('id-ID');
}

document.getElementById('diskon').addEventListener('input', hitungTotal);

function bayar() {
  if (!keranjang.length) return toast('Keranjang kosong!', 'warning');
  const total = keranjang.reduce((s, i) => s + i.subtotal, 0) - (parseInt(document.getElementById('diskon').value)||0);
  document.getElementById('modalTotal').textContent = 'Rp ' + total.toLocaleString('id-ID');
  document.getElementById('modalBayar').classList.remove('hidden');
  document.getElementById('uangBayar').value = total;
  hitungKembalian();
}

function tutupModalBayar() { document.getElementById('modalBayar').classList.add('hidden'); }

async function pilihMetode(m) {
  metodePilih = m;
  ['cash','qris','piutang'].forEach(x => {
    document.getElementById('m' + x.charAt(0).toUpperCase() + x.slice(1))
      .className = 'py-3 rounded-xl font-semibold ' + (x === m ? 'bg-red-500' : 'bg-slate-700');
  });
  document.getElementById('inputCash').classList.toggle('hidden', m !== 'cash');
  document.getElementById('inputPiutang').classList.toggle('hidden', m !== 'piutang');
  document.getElementById('inputQris').classList.toggle('hidden', m !== 'qris');

  if (m === 'qris') {
    const total = keranjang.reduce((s, i) => s + i.subtotal, 0) - (parseInt(document.getElementById('diskon').value)||0);
    document.getElementById('qrisTotal').textContent = 'Rp ' + total.toLocaleString('id-ID');
    const { data } = await db.from('settings').select('value').eq('key', 'qris_image_url').maybeSingle();
    if (data?.value) {
      document.getElementById('qrisPreview').innerHTML = `<img src="${data.value}" class="w-56 h-56 object-contain">`;
    } else {
      document.getElementById('qrisPreview').innerHTML = `<div class="w-56 h-56 bg-slate-200 rounded flex items-center justify-center text-slate-500 text-sm text-center p-4">⚠️ QRIS belum diatur.<br>Admin perlu upload QR di Pengaturan.</div>`;
    }
  }
}

document.getElementById('uangBayar').addEventListener('input', hitungKembalian);

function hitungKembalian() {
  const total = keranjang.reduce((s, i) => s + i.subtotal, 0) - (parseInt(document.getElementById('diskon').value)||0);
  const bayar = parseInt(document.getElementById('uangBayar').value) || 0;
  document.getElementById('kembalian').textContent = 'Rp ' + (bayar - total).toLocaleString('id-ID');
}

async function konfirmasiBayar() {
  const subtotal = keranjang.reduce((s, i) => s + i.subtotal, 0);
  const diskon = parseInt(document.getElementById('diskon').value) || 0;
  const total = subtotal - diskon;
  const bayarVal = parseInt(document.getElementById('uangBayar').value) || 0;

  if (metodePilih === 'cash' && bayarVal < total) return toast('Uang kurang!', 'error');
  if (metodePilih === 'qris') {
    if (!await konfirmasi('Yakin pelanggan sudah selesai bayar via QRIS?\nJumlah: Rp ' + total.toLocaleString('id-ID'), 'Konfirmasi QRIS')) return;
  }
  if (metodePilih === 'piutang') {
    if (!document.getElementById('namaPelanggan').value.trim()) return toast('Nama pelanggan wajib diisi!', 'warning');
  }

  const nomorTrx = 'TRX' + Date.now();
  const { data: trx, error } = await db.from('transactions').insert({
    nomor_trx: nomorTrx,
    kasir_id: user.id,
    subtotal, diskon, total,
    metode_bayar: metodePilih,
    bayar: metodePilih === 'cash' ? bayarVal : total,
    kembalian: metodePilih === 'cash' ? bayarVal - total : 0,
    status: 'selesai'
  }).select().single();

  if (error) return toast('Error: ' + error.message, 'error');

  await db.from('transaction_items').insert(
    keranjang.map(i => ({ ...i, transaction_id: trx.id }))
  );

  for (const i of keranjang) {
    const p = produkAll.find(x => x.id === i.product_id);
    await db.from('products').update({ stok: p.stok - i.qty }).eq('id', p.id);
    p.stok -= i.qty;
  }

  if (metodePilih === 'piutang') {
    await db.from('piutang').insert({
      transaction_id: trx.id,
      nama_pelanggan: document.getElementById('namaPelanggan').value,
      total_utang: total,
      sisa: total,
      status: 'belum_lunas',
      jatuh_tempo: document.getElementById('jatuhTempo').value || null
    });
  }

  toast('Transaksi berhasil! ' + nomorTrx, 'success');
  const itemsCopy = [...keranjang];
  keranjang = [];
  document.getElementById('diskon').value = 0;
  document.getElementById('namaPelanggan').value = '';
  document.getElementById('jatuhTempo').value = '';
  renderKeranjang();
  renderProduk();
  tutupModalBayar();
  cetakStruk(trx, itemsCopy);
}

function simpanHold() {
  if (!keranjang.length) return;
  localStorage.setItem('holdBill', JSON.stringify(keranjang));
  toast('Bill disimpan', 'success');
}

async function cetakStruk(trx, items) {
  const { data: setting } = await db.from('settings').select('*');
  const map = Object.fromEntries((setting || []).map(s => [s.key, s.value]));
  const namaToko = map.nama_toko || 'KASIR PRO';
  const alamat = map.alamat_toko || '';
  const noHp = map.no_hp_toko || '';

  const w = window.open('', '', 'width=320,height=600');
  w.document.write(`
    <!DOCTYPE html><html><head><title>Struk ${trx.nomor_trx}</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Courier New', monospace; font-size: 12px; width: 58mm; padding: 5mm 2mm; line-height: 1.3; }
      .center { text-align: center; } .bold { font-weight: bold; } .big { font-size: 14px; }
      .divider { border-top: 1px dashed #000; margin: 4px 0; }
      .flex { display: flex; justify-content: space-between; }
      .item-name { font-weight: bold; } .item-detail { padding-left: 8px; font-size: 11px; }
      .total { font-size: 14px; font-weight: bold; }
      @media print { @page { size: 58mm auto; margin: 0; } body { width: 58mm; } }
    </style></head><body>
      <div class="center bold big">${namaToko.toUpperCase()}</div>
      ${alamat ? `<div class="center" style="font-size:10px">${alamat}</div>` : ''}
      ${noHp ? `<div class="center" style="font-size:10px">Telp: ${noHp}</div>` : ''}
      <div class="divider"></div>
      <div class="flex"><span>No</span><span>${trx.nomor_trx}</span></div>
      <div class="flex"><span>Tgl</span><span>${new Date().toLocaleString('id-ID', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>
      <div class="flex"><span>Kasir</span><span>${user.nama}</span></div>
      <div class="divider"></div>
      ${items.map(i => `<div class="item-name">${i.nama_produk}</div><div class="flex item-detail"><span>${i.qty} x ${i.harga.toLocaleString('id-ID')}</span><span>${i.subtotal.toLocaleString('id-ID')}</span></div>`).join('')}
      <div class="divider"></div>
      <div class="flex"><span>Subtotal</span><span>Rp ${trx.subtotal.toLocaleString('id-ID')}</span></div>
      ${trx.diskon > 0 ? `<div class="flex"><span>Diskon</span><span>-Rp ${trx.diskon.toLocaleString('id-ID')}</span></div>` : ''}
      <div class="flex total"><span>TOTAL</span><span>Rp ${trx.total.toLocaleString('id-ID')}</span></div>
      <div class="divider"></div>
      <div class="flex"><span>${trx.metode_bayar.toUpperCase()}</span><span>Rp ${trx.bayar.toLocaleString('id-ID')}</span></div>
      ${trx.metode_bayar === 'cash' ? `<div class="flex"><span>Kembali</span><span>Rp ${trx.kembalian.toLocaleString('id-ID')}</span></div>` : ''}
      <div class="divider"></div>
      <div class="center" style="margin-top:8px">~ Terima Kasih ~<br>Selamat berbelanja kembali 🙏</div>
    </body></html>
  `);
  w.document.close();
  setTimeout(() => w.print(), 500);
}
</script>
</body>
</html>
